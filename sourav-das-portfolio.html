<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0810">
<title>Sourav Das — Digital Marketing Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0810;--panel:#100e1a;--line:#241f3a;--text:#eeedf3;--muted:#9d98b2;--acc:#a898ff;--disp:'Bebas Neue',Impact,sans-serif;--font:'Manrope',system-ui,sans-serif;--mono:'DM Mono',ui-monospace,monospace;--w:min(1160px,calc(100% - 48px))}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.16;background:var(--acc);animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;left:-120px;top:-100px}
.aurora i:nth-child(2){width:420px;height:420px;right:-100px;top:30%;background:#6046c8;animation-duration:28s;animation-delay:-8s}
.aurora i:nth-child(3){width:380px;height:380px;left:35%;bottom:-160px;background:#3e3074;animation-duration:31s;animation-delay:-14s}
@keyframes drift{to{transform:translate(120px,80px) scale(1.2)}}
.glow{position:fixed;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,rgba(168,152,255,.10),transparent 65%);pointer-events:none;z-index:1;left:-999px;top:-999px}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(10,8,16,.75))}
.wrap{width:var(--w);margin-inline:auto;position:relative;z-index:2}
header{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(10,8,16,.6);border-bottom:1px solid var(--line)}
.bar{height:72px;display:flex;align-items:center;justify-content:space-between}
.bn{display:flex;align-items:center;gap:11px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:13px;letter-spacing:.12em}
.mark{width:36px;height:36px;display:grid;place-items:center;border:1px solid #423e53;border-radius:10px;font-size:19px;letter-spacing:-.08em;transition:.3s}
.mark b{color:var(--acc);font-weight:800}
.brand:hover .mark{background:var(--acc);color:#110f1b;border-color:var(--acc)}.brand:hover .mark b{color:#110f1b}
nav{display:flex;align-items:center;gap:32px;font-size:14px;color:#bfbccc}
nav a:not(.cta){position:relative;padding:4px 0}
nav a:not(.cta):after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .3s}
nav a:not(.cta):hover:after{transform:scaleX(1)}
.cta{color:var(--acc);border:1px solid #413d51;border-radius:999px;padding:9px 18px;transition:.25s}
.cta:hover{background:var(--acc);color:#110f1b}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:42px;height:42px;color:var(--text);cursor:pointer;font-size:18px}
/* hero */
.hero{min-height:calc(100svh - 72px);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:48px;padding-block:72px}
.tag{display:inline-flex;align-items:center;gap:10px;font:500 12px var(--mono);letter-spacing:.06em;color:var(--acc);border:1px solid #2c2546;background:rgba(16,14,26,.7);border-radius:999px;padding:7px 14px;margin-bottom:28px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 rgba(168,152,255,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(168,152,255,0)}100%{box-shadow:0 0 0 0 rgba(168,152,255,0)}}
h1,h2{margin:0;font-weight:600;letter-spacing:-.05em;line-height:1.08}
h1{font-size:clamp(46px,6.6vw,84px)}
h2{font-size:clamp(36px,4.8vw,58px)}
.ln{display:block;overflow:hidden;padding-bottom:.08em}
.ln>span{display:inline-block;transform:translateY(110%);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.ln:nth-child(2)>span{animation-delay:.12s}.ln:nth-child(3)>span{animation-delay:.24s}
@keyframes rise{to{transform:none}}
.shine{font-style:italic;font-weight:500;background:linear-gradient(100deg,#a898ff 20%,#efecff 45%,#a898ff 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 4s linear infinite}
@keyframes sheen{to{background-position:-220% 0}}
.fade{opacity:0;transform:translateY(16px);animation:up .8s .5s cubic-bezier(.2,.8,.2,1) forwards}
.fade.d2{animation-delay:.7s}.fade.d3{animation-delay:.9s}
@keyframes up{to{opacity:1;transform:none}}
.lede{max-width:500px;color:#b0acc1;font-size:17px;line-height:1.8;margin:28px 0 34px}
.actions{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:14px;background:var(--acc);color:#110f1b;font-weight:800;font-size:14px;border-radius:8px;padding:15px 22px;transition:.25s;box-shadow:0 0 0 0 rgba(168,152,255,.4)}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 34px -8px rgba(168,152,255,.45);background:#c4baff}
.link{font-weight:700;font-size:14px;color:var(--text)}.link:hover{color:var(--acc)}
.note{display:flex;align-items:center;gap:12px;color:#837d9d;font:12px var(--mono);margin-top:48px}
.note:before{content:"";width:28px;height:1px;background:var(--acc)}
/* hero visual */
.visual{position:relative;aspect-ratio:1;width:100%;max-width:470px;justify-self:center;display:grid;place-items:center}
.ring{position:absolute;border:1px solid #2f284b;border-radius:50%}
.r1{inset:4%;animation:spin 40s linear infinite}.r2{inset:20%;border-style:dashed;border-color:#27223e;animation:spin 28s linear infinite reverse}
.ring i{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 22px var(--acc);top:-6px;left:50%;margin-left:-6px}
.r2 i{width:8px;height:8px;margin-left:-4px;top:-4px;background:#d6cfff}
@keyframes spin{to{transform:rotate(360deg)}}
.core{width:36%;aspect-ratio:1;border-radius:50%;border:1px solid #605a77;background:radial-gradient(circle at 35% 30%,#27213e,#0f0d18 70%);display:grid;place-items:center;box-shadow:0 0 90px rgba(168,152,255,.18);animation:float 6s ease-in-out infinite}
.core span{font-size:clamp(56px,9vw,96px);font-weight:800;letter-spacing:-.1em;color:var(--acc);transform:translateX(-4px)}
@keyframes float{50%{transform:translateY(-12px)}}
.chip{position:absolute;border:1px solid #3b3749;background:rgba(15,13,24,.88);padding:9px 14px;border-radius:8px;font:500 12px var(--mono);color:var(--acc);animation:float 5s ease-in-out infinite}
.c1{top:14%;right:0}.c2{bottom:18%;left:0;animation-delay:-2s}.c3{bottom:6%;right:12%;animation-delay:-3.5s;color:#dad7e5}
/* marquee */
.marq{position:relative;z-index:2;border-block:1px solid var(--line);background:rgba(10,8,16,.7);overflow:hidden;padding-block:16px}
.track{display:flex;width:max-content;gap:0;animation:slide 32s linear infinite}
.marq:hover .track{animation-play-state:paused}
.track span{font:500 13px var(--mono);color:#b5b1c4;padding-inline:26px;white-space:nowrap}
.track span:after{content:"✳";color:var(--acc);margin-left:52px}
@keyframes slide{to{transform:translateX(-50%)}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr) 1.3fr;gap:24px;align-items:center;padding-block:44px;border-bottom:1px solid var(--line)}
.stat strong{display:block;font-size:44px;font-weight:600;letter-spacing:-.05em;line-height:1}.stat strong em{font-style:normal;color:var(--acc)}
.stat span{display:block;font-size:14px;color:#bfbccc;margin-top:8px}.stat small{color:#756e91;font-size:12px}
.stats p{margin:0;font-size:12px;color:#6f688a;line-height:1.7}
/* sections */
.sec{padding-block:112px}
.head{margin-bottom:56px}
.head .k{font:500 12px var(--mono);color:var(--acc);letter-spacing:.06em;margin:0 0 18px}
.muted{color:#686282}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.row>p{max-width:320px;margin:0 0 6px;font-size:14px;color:#8c86a3;line-height:1.8}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:80px;align-items:start}
.about p{color:#b0acc1;font-size:16px;line-height:1.9;margin:0 0 20px;max-width:600px}
.sign{display:flex;align-items:center;gap:14px;margin-top:34px;font-size:14px;color:#dedbe8}
.sign:before{content:"";width:34px;height:1px;background:var(--acc);flex:none}.sign small{color:#797295}
.card{background:rgba(16,14,26,.85);border:1px solid #211c34;border-radius:14px;padding:12px 30px}
.step{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:24px 0;border-bottom:1px solid #221d36}.step:last-child{border:0}
.step>span{font:500 13px var(--mono);color:var(--acc);padding-top:2px}
.step strong{font-size:16px}.step p{font-size:14px;color:#8a84a3;margin:4px 0 0;line-height:1.7}
.band{background:rgba(14,12,23,.82);border-block:1px solid #191527;position:relative;z-index:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.proj{background:#120f1d;border:1px solid #241e39;border-radius:14px;overflow:hidden;transition:transform .35s,border-color .35s,box-shadow .35s;display:flex;flex-direction:column}
.proj:hover{transform:translateY(-6px);border-color:#594e85;box-shadow:0 24px 50px -24px rgba(168,152,255,.25)}
.art{height:240px;position:relative;display:grid;place-items:center;overflow:hidden}
.art:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.10) 50%,transparent 60%);transform:translateX(-100%);transition:transform .8s}
.proj:hover .art:after{transform:translateX(100%)}
.art>.kick{position:absolute;left:20px;top:16px;font:500 11px var(--mono);letter-spacing:.06em;opacity:.75}
.w{background:linear-gradient(130deg,#c4b99f,#ece3d2 52%,#9e8c6e);color:#3b3329}
.w .fr{border:1px solid #8c806a;padding:24px 34px;text-align:center}
.w .fr span{font:italic 19px Georgia,serif}.w .fr strong{display:block;font:400 27px/1.1 Georgia,serif;margin:8px 0 12px}.w .fr i{font:11px var(--mono);letter-spacing:.12em}
.g{background:radial-gradient(ellipse at 70% 20%,#2e2749,#171424 40%,#0b0911 78%)}
.g .ct{text-align:center;position:relative;z-index:1}.g .ct strong{display:block;font-size:38px;line-height:.98;letter-spacing:-.06em}.g .ct em{color:var(--acc);font-style:normal}.g .ct small{display:block;font:11px var(--mono);letter-spacing:.18em;color:#9f9ab2;margin-top:14px}
.g:before{content:"";position:absolute;width:240px;height:240px;border:1px solid #59536f;border-radius:50%;box-shadow:0 0 0 25px rgba(168,152,255,.03),0 0 0 50px rgba(168,152,255,.02);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.1)}}
.l{background:linear-gradient(135deg,#292117,#5d3d20 60%,#15130f)}
.l .ps{display:flex;flex-direction:column;align-items:center;border:1px solid #b88b4c;padding:26px 30px;color:#f7e6c4;transform:rotate(-3deg);transition:transform .4s}
.proj:hover .l .ps,.proj:hover .ps{transform:rotate(0)}
.l .ps span{font:11px var(--mono);letter-spacing:.14em}.l .ps strong{font-size:30px;letter-spacing:-.05em}.l .ps i{font:10px var(--mono);letter-spacing:.1em;margin-top:10px;color:#d2b486}
.s{background:radial-gradient(ellipse at 30% 80%,#27223a,#100e19 65%)}
.s .st{width:240px;display:grid;gap:10px}
.s .st span{border:1px solid #433f54;background:#100d19;padding:12px 16px;font:12px var(--mono);letter-spacing:.06em;color:#d3cfe1;box-shadow:5px 5px 0 rgba(168,152,255,.08);transition:transform .35s}
.s .st span:nth-child(2){margin-left:18px}.s .st span:nth-child(3){margin-left:36px;color:var(--acc)}
.proj:hover .st span{transform:translateX(8px)}
.info{padding:26px 26px 28px;display:flex;flex-direction:column;flex:1}
.meta{display:flex;justify-content:space-between;gap:12px;color:#7c7697;font:11px var(--mono);letter-spacing:.04em}
.info h3{font-size:21px;line-height:1.35;letter-spacing:-.03em;font-weight:600;margin:14px 0 10px}
.info>p{font-size:14px;line-height:1.8;color:#9d98b1;margin:0}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 20px}
.tags span{font-size:12px;color:#bcb9ca;border:1px solid #2b2545;border-radius:999px;padding:5px 12px}
.info details,.info .bt{margin-top:auto;border-top:1px solid #25203b;padding-top:14px;color:#a49fb7}
summary{list-style:none;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}summary b{color:var(--acc);font-weight:500;font-size:18px;transition:transform .3s}
details[open] summary b{transform:rotate(45deg)}
details p{font-size:13px;line-height:1.8;color:#8a84a3;margin:12px 0 0}
.bt a{font-size:13px;font-weight:800;color:var(--acc)}.bt p{font-size:12px;color:#6f688a;margin:8px 0 0}
.skills{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sk{padding:32px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .3s;position:relative}
.sk:hover{background:rgba(168,152,255,.04)}
.sk>span{font:500 12px var(--mono);color:var(--acc)}
.sk h3{font-size:19px;margin:12px 0 8px;letter-spacing:-.02em}.sk p{font-size:14px;color:#9590ab;line-height:1.85;margin:0;max-width:440px}
.fine{font-size:12px;color:#6f688a;margin-top:18px}
.exp{display:grid;grid-template-columns:.9fr 1.1fr;gap:90px}
.tl{border-left:1px solid #312a4e;padding-left:30px}
.ti{position:relative;padding-bottom:36px}.ti:last-child{padding-bottom:0}
.ti:before{content:"";position:absolute;left:-35px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 5px rgba(168,152,255,.1);animation:ping 3s infinite}
.ti small{font:500 12px var(--mono);color:var(--acc)}
.ti h3{font-size:19px;margin:8px 0 2px}.ti .co{font-size:14px;color:#bbb8c9;margin:0 0 8px}.ti p:last-child{font-size:14px;line-height:1.8;color:#8c86a3;margin:0;max-width:500px}
.panel{display:grid;grid-template-columns:1.2fr .8fr;gap:64px;padding:60px;background:rgba(16,14,26,.9);border:1px solid #292341;border-radius:20px;position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-200px;background:radial-gradient(circle,rgba(168,152,255,.14),transparent 65%);animation:drift 14s ease-in-out infinite alternate}
.panel>*{position:relative}
.panel p.c{font-size:15px;color:#9590ab;line-height:1.85;max-width:460px;margin:22px 0 0}
.links{align-self:center}
.links a{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid #292341;font-weight:700;font-size:16px;transition:.25s}
.links a span{color:var(--acc);transition:transform .25s}.links a:hover{color:var(--acc);padding-left:10px}.links a:hover span{transform:translate(4px,-4px)}
footer{position:relative;z-index:2;border-top:1px solid var(--line)}
.foot{min-height:96px;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:13px;color:#837d9d;flex-wrap:wrap;padding-bottom:env(safe-area-inset-bottom,0px)}
.foot p{margin:0}

.prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:var(--acc);transform:scaleX(0);transform-origin:left;box-shadow:0 0 12px var(--acc)}
.rv{opacity:0;transform:translateY(44px) scale(.97);filter:blur(7px);transition:opacity .8s ease,transform .95s cubic-bezier(.2,.8,.2,1),filter .8s ease;transition-delay:var(--dl,0s)}
.rv.in{opacity:1;transform:none;filter:none}
.proj.rv:nth-child(odd){transform:translate(-44px,44px) scale(.96)}.proj.rv:nth-child(even){transform:translate(44px,44px) scale(.96)}
.proj.rv.in{transform:none}
.wd{display:inline-block;opacity:0;transform:translateY(70%) rotate(5deg);filter:blur(6px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .7s ease;transition-delay:calc(var(--w)*.07s)}
.in .wd{opacity:1;transform:none;filter:none}
[data-d]{cursor:pointer}
.proj{transform-style:preserve-3d;will-change:transform}
.bt{display:flex;justify-content:space-between;align-items:center;gap:12px}
.more{margin-left:auto;font-size:13px;color:#a49fb7;display:inline-flex;gap:10px;align-items:center}
.more b{color:var(--acc);font-weight:500;font-size:18px;transition:transform .3s}.proj:hover .more b{transform:rotate(90deg)}
.sk:after{content:"+";position:absolute;right:28px;top:26px;color:var(--acc);font:20px var(--mono);transition:transform .35s}.sk:hover:after{transform:rotate(90deg) scale(1.2)}
.ti,.stat{transition:transform .3s}.ti:hover,.stat:hover{transform:translateX(6px)}
.mod{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;visibility:hidden;transition:visibility 0s .55s}
.mod.open{visibility:visible;transition-delay:0s}
.mb{position:absolute;inset:0;background:rgba(5,4,8,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .45s}
.open .mb{opacity:1}
.mp{position:relative;width:min(760px,100%);max-height:calc(100svh - 48px);overflow:auto;background:#100e1a;border:1px solid #342c52;border-radius:20px;box-shadow:0 40px 90px -20px rgba(0,0,0,.8),0 0 60px -20px rgba(168,152,255,.25);transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(.55) translateY(30px);opacity:0;transition:transform .6s cubic-bezier(.2,1.1,.3,1),opacity .35s}
.open .mp{transform:none;opacity:1}
.mx{position:absolute;right:16px;top:16px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid #413d51;background:rgba(10,8,16,.8);color:var(--text);font-size:15px;cursor:pointer;transition:.3s}
.mx:hover{background:var(--acc);color:#110f1b;transform:rotate(90deg)}
.si{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(.12s + var(--i)*.08s)}
.open .si{opacity:1;transform:none}
.mod:not(.open) .si{transition-delay:0s}
.mp .art{height:230px}
.mbody{padding:28px 34px 36px}
.mbody .mt{font:500 12px var(--mono);color:var(--acc);margin:0 0 12px}
.mbody h3{font-size:clamp(24px,4vw,32px);letter-spacing:-.04em;line-height:1.2;margin:0 0 6px;font-weight:600}
.mbody p{font-size:15px;line-height:1.85;color:#b0acc1;margin:14px 0 0}
.mbody p.ft{font-size:13px;color:#837d9d}
.fx{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:#25203b;border:1px solid #25203b;border-radius:12px;overflow:hidden;margin-top:22px}
.fx div{background:#120f1d;padding:14px 16px}.fx small{display:block;font:11px var(--mono);color:#7c7697;margin-bottom:4px}.fx b{font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chips span{font-size:13px;color:#cecadd;border:1px solid #312a4e;background:#14111f;border-radius:999px;padding:7px 14px}
.mbody .btn{margin-top:26px}
.bignum{font-size:56px;font-weight:600;letter-spacing:-.05em;line-height:1;margin:6px 0 4px}.bignum em{font-style:normal;color:var(--acc)}

/* ---- violet HUD hero ---- */
nav{text-transform:uppercase;letter-spacing:.08em;font-size:13px}
nav a.on:after{transform:scaleX(1)}nav a.on{color:var(--text)}
.stage{position:relative;z-index:2;width:min(1480px,calc(100% - 32px));margin:16px auto 0;min-height:max(660px,calc(100svh - 104px));border-radius:34px;display:flex;align-items:center;background:rgba(8,6,16,.5);overflow:hidden;--mx:0;--my:0}
.frame{position:absolute;inset:0;border:1.5px solid rgba(190,180,255,.5);border-radius:34px;box-shadow:inset 0 0 60px rgba(168,152,255,.14),0 0 26px rgba(168,152,255,.22);pointer-events:none;z-index:3;animation:fglow 5s ease-in-out infinite}
@keyframes fglow{50%{box-shadow:inset 0 0 90px rgba(168,152,255,.24),0 0 44px rgba(168,152,255,.4)}}
.frame i{position:absolute}
.sweep{top:-1px;left:-25%;height:2px;width:22%;background:linear-gradient(90deg,transparent,#fff,transparent);animation:sw 6s linear infinite}

const proj=p=>`<article class="proj" data-d="${p.id}" tabindex="0" role="button"><div class="art ${p.style}"><span class="kick">${p.kicker}</span>${art[p.style](p.art)}</div><div class="info"><div class="meta"><span>${p.metaL}</span><span>${p.metaR}</span></div><h3>${p.title}</h3><p>${p.text}</p><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div><div class="bt">${p.link?`<a href="#" target="_blank" rel="noreferrer" data-link="${p.link.to}">${p.link.label}</a>`:''}<span class="more">View details <b>+</b></span></div></div></article>`;
const D='data-d="X" tabindex="0" role="button"';
return `<section class="stage" id="stage">
<div class="frame" aria-hidden="true"><i class="sweep"></i><i class="sweep b"></i><i class="cn tl"></i><i class="cn br"></i></div>
<div class="orbit" aria-hidden="true"><div class="halo"></div><div class="ring r1"><i></i></div><div class="ring r2"><i></i></div></div>
<div class="vt" aria-hidden="true"><span class="fill">${S.bigWord}</span><span class="out">${S.bigWord}</span></div>
<div class="hero2"><div>
<div class="tag fade"><span class="dot"></span>${H.status}</div>
<p class="hk fade d2">${H.kicker.join('<br>')}</p><span class="kbar fade d2"></span>
<h1>${H.headline.map((l,i)=>`<span class="ln"><span>${i==H.headline.length-1?`<span class="shine">${l}</span>`:l}</span></span>`).join('')}</h1>
<p class="lede fade d2">${H.intro}</p>
<div class="actions fade d3"><a class="vbtn" href="#work"><span>${H.button}</span><b>→</b></a><a class="link" href="#contact">${H.link}</a></div></div>
<div class="hr"><div class="gc"><div class="gh"><span class="gi">✎</span><div><small>${H.cardTitle[0]}</small><strong>${H.cardTitle[1]}</strong></div></div><ul>${H.cardList.map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class="gc">${H.stats.map(o=>`<div class="gs"><strong>${num(o,1)}${o.plus||''}</strong><span>${o.label}</span></div>`).join('')}</div></div></div>
<div class="sh" aria-hidden="true"><span class="mouse"><i></i></span><span>SCROLL<br>DOWN</span></div></section>
<div class="marq" aria-hidden="true"><div class="track" id="track"></div></div>
<section class="scene" id="scene"><div class="sin"><p class="sl">${SC.label}</p><p class="sx">${SC.text.split(' ').map(w=>`<span class="sw${SC.highlight.some(h=>w.toLowerCase().includes(h))?' hl':''}">${w}</span>`).join(' ')}</p></div></section>
<section class="wrap stats" aria-label="Highlights">${N.items.map(o=>`<div class="stat" ${D.replace('X','stat')}><strong>${num(o)}${o.plus?`<em>${o.plus}</em>`:''}</strong><span>${o.label}<br><small>${o.sub}</small></span></div>`).join('')}<p>${N.note}</p></section>
<section id="about" class="wrap sec"><div class="head"><p class="k">${A.label}</p><h2>${two(A.heading)}</h2></div><div class="about"><div>${A.paragraphs.map(p=>`<p>${p}</p>`).join('')}<div class="sign"><span>${A.sign}<br><small>${A.signSub}</small></span></div></div><div class="card">${A.steps.map((s,i)=>`<div class="step"><span>0${i+1}</span><div><strong>${s[0]}</strong><p>${s[1]}</p></div></div>`).join('')}</div></div></section>
<section id="work" class="band"><div class="wrap sec"><div class="head row"><div><p class="k">${W.label}</p><h2>${two(W.heading)}</h2></div><p>${W.intro}</p></div><div class="grid">${W.projects.map(proj).join('')}</div></div></section>
<section id="skills" class="wrap sec"><div class="head"><p class="k">${K.label}</p><h2>${two(K.heading)}</h2></div><div class="skills">${K.groups.map((g,i)=>`<div class="sk" ${D.replace('X','sk')}><span>0${i+1}</span><h3>${g.title}</h3><p>${g.items.join(' · ')}</p></div>`).join('')}</div><p class="fine">${K.note}</p></section>
<section class="band" id="exp"><div class="wrap sec exp"><div>${kl(E.label)}<h2>${two(E.heading)}</h2></div><div class="tl">${E.items.map(t=>`<div class="ti" ${D.replace('X','ti')}><small>${t.date}</small><h3>${t.role}</h3><p class="co">${t.org}</p><p>${t.text}</p></div>`).join('')}</div></div></section>
<section id="contact" class="wrap sec"><div class="panel"><div>${kl(C.label)}<h2>${C.heading[0]}<br>${C.heading[1]} <span class="shine">${C.highlight}</span></h2><p class="c">${C.text}</p></div><div class="links"><a href="#" data-link="email">Email me <span>↗</span></a><a href="#" target="_blank" rel="noreferrer" data-link="linkedin">LinkedIn <span>↗</span></a><a href="#" target="_blank" rel="noreferrer" data-link="youtube">YouTube <span>↗</span></a></div></div></section>`}
document.getElementById('top').innerHTML=renderSite(SITE);
document.title=SITE.name+' — Portfolio';
document.querySelectorAll('.bn').forEach(e=>{e.innerHTML=`<span class="mark">${SITE.logo}<b>.</b></span>${SITE.name.toUpperCase()}`});
document.getElementById('ft').textContent=SITE.footer;
const EX={};SITE.work.projects.forEach(p=>EX[p.id]={f:p.facts,m:p.notes});

const links={email:SITE.contact.email,linkedin:SITE.contact.linkedin,youtube:SITE.contact.youtube};
document.querySelectorAll("[data-link]").forEach(a=>{const v=links[a.dataset.link];if(v)a.href=a.dataset.link==="email"?"mailto:"+v:v});
document.getElementById("yr").textContent=new Date().getFullYear();
const nav=document.getElementById("nav"),bur=document.getElementById("burger");
bur.onclick=()=>bur.setAttribute("aria-expanded",nav.classList.toggle("open"));
nav.querySelectorAll("a").forEach(a=>a.onclick=()=>{nav.classList.remove("open");bur.setAttribute("aria-expanded","false")});
// marquee
const words=SITE.marquee;
const t=document.getElementById("track");t.innerHTML=[...words,...words].map(w=>`<span>${w}</span>`).join("");
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
// counters
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target,n=+el.dataset.n,suf=el.dataset.suf||"",pad=+el.dataset.pad||0,fmt=v=>String(v).padStart(pad,"0")+suf;
if(still){el.textContent=fmt(n);return}const s=performance.now();(function f(now){const p=Math.min((now-s)/1400,1),v=Math.round(n*(1-Math.pow(1-p,3)));el.textContent=fmt(v);if(p<1)requestAnimationFrame(f)})(s)}),{threshold:.6});
document.querySelectorAll("[data-n]").forEach(el=>io.observe(el));
// live background
const cv=document.getElementById("bg"),cx=cv.getContext("2d"),glow=document.getElementById("glow");
let W,H,P=[],m={x:-999,y:-999},dpr=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);const n=Math.min(Math.round(W*H/16000),110);P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6}))}
function draw(){cx.clearRect(0,0,W,H);
for(const p of P){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);if(d<160){p.x+=dx/d*(160-d)*.02;p.y+=dy/d*(160-d)*.02}
if(!still){p.x+=p.vx;p.y+=p.vy}if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0}
for(let i=0;i<P.length;i++){const a=P[i];cx.fillStyle="rgba(168,152,255,.7)";cx.beginPath();cx.arc(a.x,a.y,a.r,0,6.283);cx.fill();
for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<140){cx.strokeStyle=`rgba(168,152,255,${(1-d/140)*.22})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
const d=Math.hypot(a.x-m.x,a.y-m.y);if(d<190){cx.strokeStyle=`rgba(168,152,255,${(1-d/190)*.5})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(m.x,m.y);cx.stroke()}}
if(!still)requestAnimationFrame(draw)}
addEventListener("resize",()=>{size();if(still)draw()});
addEventListener("pointermove",e=>{m.x=e.clientX;m.y=e.clientY;glow.style.left=m.x+"px";glow.style.top=m.y+"px"},{passive:true});
size();draw();
/* ---- hero parallax + section counter ---- */
const stg=document.getElementById('stage');
if(!still)addEventListener('pointermove',e=>{stg.style.setProperty('--mx',(e.clientX/innerWidth-.5)*2);stg.style.setProperty('--my',(e.clientY/innerHeight-.5)*2)},{passive:true});
const ids=['stage','about','work','skills','exp','contact'],cn=document.getElementById('cn'),navA=[...document.querySelectorAll('nav a')];
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const id=e.target.id,i=ids.indexOf(id);cn.textContent=String(i+1).padStart(2,'0');cn.classList.remove('pop');void cn.offsetWidth;cn.classList.add('pop');setGlow(i);const h=id==='stage'?'#top':'#'+id;navA.forEach(a=>a.classList.toggle('on',a.getAttribute('href')===h))}),{rootMargin:'-45% 0px -50% 0px'});
ids.forEach(id=>{const el=document.getElementById(id);if(el)spy.observe(el)});
/* ---- scroll reveal ---- */
const sel='.head .k,.about p,.sign,.step,.proj,.sk,.ti,.stat,.stats p,.fine,.panel p.c,.links a';
if(!still){
document.querySelectorAll(sel).forEach(el=>{const i=[...el.parentNode.children].indexOf(el);el.style.setProperty('--dl',(i%4)*.12+'s');el.classList.add('rv')});
const rv=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;rv.unobserve(el);el.classList.add('in');
if(el.classList.contains('k'))scramble(el);
if(el.classList.contains('rv'))setTimeout(()=>{el.classList.remove('rv','in');el.style.removeProperty('--dl')},1700)}),{threshold:.15,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('.rv').forEach(el=>rv.observe(el));
const split=(n,c)=>[...n.childNodes].forEach(x=>{if(x.nodeType===3){const f=document.createDocumentFragment();x.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(!t.trim()){f.append(' ');return}const w=document.createElement('span');w.className='wd';w.style.setProperty('--w',c.n++);w.textContent=t;f.append(w)});x.replaceWith(f)}else if(x.nodeName!=='BR'){if(x.classList.contains('shine')){x.classList.add('wd');x.style.setProperty('--w',c.n++)}else split(x,c)}});
const hio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');hio.unobserve(e.target)}}),{threshold:.3});
document.querySelectorAll('.head h2,.panel h2,.exp h2').forEach(h=>{split(h,{n:0});hio.observe(h)});
}
function scramble(el){const t=el.textContent,ch='01<>/+*#';let f=0;const id=setInterval(()=>{el.textContent=[...t].map((c,i)=>c===' '?c:i<f/1.5?c:ch[Math.random()*ch.length|0]).join('');if(++f>t.length*1.5){el.textContent=t;clearInterval(id)}},28)}
/* ---- scroll progress ---- */
const prog=document.getElementById('prog');
addEventListener('scroll',()=>{prog.style.transform=`scaleX(${scrollY/(document.documentElement.scrollHeight-innerHeight||1)})`},{passive:true});
/* ---- 3D tilt on project cards ---- */
if(!still&&matchMedia('(hover:hover)').matches)document.querySelectorAll('.proj').forEach(c=>{
c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(900px) rotateX(${-y*7}deg) rotateY(${x*9}deg) translateY(-6px)`});
c.addEventListener('pointerleave',()=>c.style.transform='')});
/* ---- click for details ---- */
const mod=document.getElementById('mod'),mp=mod.querySelector('.mp'),mc=document.getElementById('mc');let last=null;
function build(el){let n=0;const si=h=>`<div class="si" style="--i:${n++}">${h}</div>`,d=el.dataset.d,q=x=>el.querySelector(x),tx=x=>q(x)?q(x).textContent.trim():'';let top='',b='';
if(EX[d]){const x=EX[d];top=si(q('.art').outerHTML);n=0;
b=si(`<p class="mt">${tx('.meta')}</p>`.replace(/(<\/span>)?(.+)/,'$&'))+si(`<h3 id="mt">${tx('h3')}</h3>`)+si(`<p>${tx('.info>p')}</p>`)+si(`<div class="fx">${x.f.map(f=>`<div><small>${f[0]}</small><b>${f[1]}</b></div>`).join('')}</div>`)+si(`<div class="chips">${[...el.querySelectorAll('.tags span')].map(s=>`<span>${s.textContent}</span>`).join('')}</div>`)+x.m.map((t,i)=>si(`<p class="${i?'ft':''}">${t}</p>`)).join('');
const a=q('.bt a');if(a)b+=si(`<a class="btn" href="${a.href}" target="_blank" rel="noreferrer">Visit channel <span>↗</span></a>`)}
else if(d==='sk'){b=si(`<p class="mt">Skill group ${tx('span')}</p>`)+si(`<h3 id="mt">${tx('h3')}</h3>`)+si(`<div class="chips">${tx('p').split(' · ').map(s=>`<span>${s}</span>`).join('')}</div>`)+si(`<p class="ft">${tx('.fine')||document.querySelector('.fine').textContent}</p>`)}
else if(d==='ti'){b=si(`<p class="mt">${tx('small')}</p>`)+si(`<h3 id="mt">${tx('h3')}</h3>`)+si(`<p>${tx('.co')}</p>`)+si(`<p>${el.lastElementChild.textContent}</p>`)}
else{b=si(`<p class="mt">Highlight</p>`)+si(`<div class="bignum" id="mt">${q('strong').textContent}</div>`)+si(`<h3>${q('span').firstChild.textContent}</h3>`)+si(`<p>${tx('small')}</p>`)+si(`<p class="ft">${document.querySelector('.stats p').textContent}</p>`)}
mc.innerHTML=top+`<div class="mbody">${b}</div>`}
function openMod(el,x,y){last=el;build(el);const r=mp.getBoundingClientRect();mp.style.setProperty('--ox',Math.max(0,Math.min(r.width,x-r.left))+'px');mp.style.setProperty('--oy',Math.max(0,Math.min(r.height,y-r.top))+'px');mp.scrollTop=0;document.body.style.overflow='hidden';lenis&&lenis.stop();mod.setAttribute('aria-hidden','false');requestAnimationFrame(()=>requestAnimationFrame(()=>{mod.classList.add('open');document.getElementById('mx').focus({preventScroll:true})}))}
function closeMod(){mod.classList.remove('open');mod.setAttribute('aria-hidden','true');document.body.style.overflow='';lenis&&lenis.start();if(last)last.focus({preventScroll:true})}
document.addEventListener('click',e=>{if(mod.classList.contains('open')){if(e.target.closest('.mx')||e.target.classList.contains('mb'))closeMod();return}
if(e.target.closest('a'))return;const el=e.target.closest('[data-d]');if(el)openMod(el,e.clientX,e.clientY)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mod.classList.contains('open'))closeMod();
if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-d]')){e.preventDefault();const r=e.target.getBoundingClientRect();openMod(e.target,r.left+r.width/2,r.top+r.height/2)}});

/* ---- cinematic layer: smooth scroll, intro, parallax, scene, glow ---- */
let lenis=null;
try{if(typeof Lenis!=='undefined'&&!still){lenis=new Lenis({duration:1.2});const raf=t=>{lenis.raf(t);requestAnimationFrame(raf)};requestAnimationFrame(raf)}}catch(e){lenis=null}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]'),h=a&&a.getAttribute('href');if(!h||h==='#')return;const t=h==='#top'?0:document.querySelector(h);if(t===null)return;e.preventDefault();if(lenis)lenis.scrollTo(t,{offset:-80});else if(t===0)scrollTo({top:0,behavior:'smooth'});else t.scrollIntoView({behavior:'smooth'})});
const GL=['#7d6df0','#9b5cf0','#d553c8','#ff6aa0','#ff8f6b','#7d6df0'];
function setGlow(i){const r=document.documentElement.style;r.setProperty('--g1',GL[i]);r.setProperty('--g2',GL[(i+1)%6]);r.setProperty('--g3',GL[(i+2)%6])}
const sc=document.getElementById('scene'),sws=[...sc.querySelectorAll('.sw')],sx=sc.querySelector('.sx');
function onScroll(){const y=scrollY,sh=stg.offsetHeight;
stg.style.setProperty('--sy',(-y*.22)+'px');stg.style.setProperty('--sy2',(y*.12)+'px');stg.style.setProperty('--hy',(y*.18)+'px');stg.style.setProperty('--ho',Math.max(0,1-y/(sh*.75)));
const r=sc.getBoundingClientRect(),p=Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)));sx.style.setProperty('--sp',p);const k=p*sws.length*1.25;sws.forEach((w,i)=>w.classList.toggle('on',i<k))}
if(!still){addEventListener('scroll',onScroll,{passive:true});onScroll()}else sws.forEach(w=>w.classList.add('on'));
(function(){const it=document.getElementById('intro');if(!it)return;
if(still){it.remove();document.body.classList.remove('pre');return}
const iw=document.getElementById('iw'),ic=document.getElementById('ic'),bar=document.getElementById('ibar');
iw.innerHTML=[...SITE.bigWord].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('');
lenis&&lenis.stop();let st=null;
function f(t){if(!st)st=t;const p=Math.min((t-st)/1800,1),v=Math.round(100*(1-Math.pow(1-p,2.2)));ic.textContent=v;bar.style.transform=`scaleX(${v/100})`;
if(p<1)requestAnimationFrame(f);else setTimeout(()=>{it.classList.add('done');document.body.classList.remove('pre');lenis&&lenis.start();setTimeout(()=>it.remove(),1300)},300)}
requestAnimationFrame(f)})();
</script>
</body>
